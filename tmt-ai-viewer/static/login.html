<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tmt-ai viewer — login</title>
  <style>
    :root {
      --bg: #0f1218; --bg2: #151a23; --border: #2a3344;
      --text: #d7dde8; --muted: #8a94a8; --accent: #4c9aff; --red: #e5534b;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; align-items: center; justify-content: center;
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }
    form {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
      padding: 28px; width: 320px; display: flex; flex-direction: column; gap: 12px;
    }
    h1 { margin: 0 0 4px; font-size: 18px; }
    input {
      font: inherit; color: inherit; background: var(--bg);
      border: 1px solid var(--border); border-radius: 6px; padding: 9px 11px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      font: inherit; cursor: pointer; background: var(--accent); color: #fff;
      border: none; border-radius: 6px; padding: 9px 11px;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #error { color: var(--red); font-size: 13px; min-height: 18px; margin: 0; }
  </style>
</head>
<body>
  <form id="login-form">
    <h1>tmt-ai viewer</h1>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" autofocus required>
    <button id="submit" type="submit">Log in</button>
    <p id="error"></p>
  </form>
  <script>
    "use strict";
    const form = document.getElementById("login-form");
    const password = document.getElementById("password");
    const submit = document.getElementById("submit");
    const error = document.getElementById("error");
    let countdown = null;

    function lock(seconds) {
      submit.disabled = true;
      password.disabled = true;
      clearInterval(countdown);
      let left = seconds;
      const tick = () => {
        if (left <= 0) {
          clearInterval(countdown);
          submit.disabled = false;
          password.disabled = false;
          error.textContent = "";
          return;
        }
        const m = Math.floor(left / 60), s = left % 60;
        error.textContent = `Too many attempts — locked for ${m}:${String(s).padStart(2, "0")}`;
        left--;
      };
      tick();
      countdown = setInterval(tick, 1000);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submit.disabled = true;
      error.textContent = "";
      try {
        const resp = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: password.value }),
        });
        const data = await resp.json();
        if (resp.ok) { location.reload(); return; }
        if (resp.status === 429) { lock(data.locked_for || 300); return; }
        error.textContent = data.attempts_left != null
          ? `Wrong password (${data.attempts_left} attempts left)`
          : (data.error || "Login failed");
      } catch (err) {
        error.textContent = "Network error";
      }
      if (!password.disabled) submit.disabled = false;
      password.select();
    });
  </script>
</body>
</html>
